[package]
name = "tauri-plugin-plaguex-android"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native Android helpers for Plaguex: screen orientation, system bar insets, immersive playback"
links = "tauri-plugin-plaguex-android"

[dependencies]
tauri = { version = "2.11" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
