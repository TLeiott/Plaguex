[package]
name = "plaguex"
version = "1.0.0"
description = "A fast, no-nonsense Plex client"
authors = ["Plaguex contributors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "plaguex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-os = "2.3"
tauri-plugin-opener = "2.5"
plaguex-downloader = { path = "../../../crates/downloader" }
plaguex-mpv = { path = "../../../crates/mpv" }
tauri-plugin-plaguex-android = { path = "../../../crates/tauri-plugin-plaguex-android" }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
